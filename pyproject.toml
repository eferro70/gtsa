[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtsa"
version = "0.1.0"
description = "GTSA - Gerador de Testes de Segurança de APIs (Clean Architecture)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.2.2",
    "tree-sitter>=0.20.0",
    "tree-sitter-typescript>=0.20.2",
    "tree_sitter_java>=0.23.5",
    "schemathesis>=4.15.2",
    "openapi>=2.0.0",
    "jsonschema>=4.26.0",
    "requests>=2.28.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
llm = [
    "transformers>=5.6.2",
    "torch>=2.11.0",
    "accelerate>=1.13.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
gtsa-scan = "gtsa.interfaces.cli.step1_scan:main"
gtsa-openapi = "gtsa.interfaces.cli.step2_openapi:main"
gtsa-examples = "gtsa.interfaces.cli.step3_dados_exemplo:main"
gtsa-analyze = "gtsa.interfaces.cli.step4_analyzer_and_enricher:main"
gtsa-schemathesis = "gtsa.interfaces.cli.step5_schemathesis_with_data:main"
gtsa-report = "gtsa.interfaces.cli.step6_gerar_relatorio_markdown:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gtsa*"]

[tool.setuptools.package-data]
gtsa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore:Module already imported so cannot be rewritten; _hypothesis_globals",
    "ignore:Module already imported so cannot be rewritten; hypothesis",
    "ignore:Module already imported so cannot be rewritten; schemathesis",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
packages = ["gtsa"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
